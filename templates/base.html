<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Question Generator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">📚 Question Generator</h1>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}" class="nav-link">Home</a></li>
                <li><a href="{{ url_for('generate_page') }}" class="nav-link">Generate</a></li>
                <li><a href="{{ url_for('list_page') }}" class="nav-link">List</a></li>
                <li><a href="{{ url_for('practice_page') }}" class="nav-link">Practice</a></li>
                <li><a href="{{ url_for('quiz_page') }}" class="nav-link">Quiz</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2024 Question Generator | Powered by LLM</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
